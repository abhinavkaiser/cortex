name: Learning curriculum release

on:
  push:
    branches: [codex/interactive-learning, codex/complete-learning]
    paths: [.github/workflows/learning-release.yml, .github/scripts/learning_release.py, backend/content/source_checks.json]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the reviewed learning release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cortex-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, linux, x64, cortex-production]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Inspect production and content references
        if: ${{ !inputs.deploy }}
        run: python3 .github/scripts/learning_release.py
      - name: Calibrate constrained education models
        if: ${{ !inputs.deploy && github.ref == 'refs/heads/codex/complete-learning' }}
        run: python3 .github/scripts/learning_release.py --calibrate
      - name: Deploy reviewed release
        if: ${{ inputs.deploy && github.ref == 'refs/heads/main' }}
        run: python3 .github/scripts/learning_release.py --deploy

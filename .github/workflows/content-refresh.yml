name: Refresh public daily learning content
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cortex-production-release
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: [self-hosted, linux, x64, cortex-production]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run the existing public-content generator
        run: python3 .github/scripts/refresh_public_content.py
